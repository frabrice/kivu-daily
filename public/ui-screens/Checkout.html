<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Payment: MoMo, Airtel or card</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
html,body{overflow:hidden}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:Inter,sans-serif;cursor:pointer}
.ln{display:flex;justify-content:space-between;font-size:14px;color:#6B7280;padding:5px 0}
.ln b{font-weight:500;color:#141B26}
.m{width:100%;display:flex;gap:14px;align-items:center;padding:0 16px;height:64px;background:#fff;border:0;text-align:left}
.ic{width:36px;height:36px;border-radius:50%;background:#F3F4F6;display:flex;align-items:center;justify-content:center;flex:none}
.rd{width:20px;height:20px;border-radius:50%;flex:none;box-sizing:border-box}
.t{font-weight:600;font-size:15px;color:#141B26}
.s{font-size:13px;color:#6B7280;margin-top:2px}
</style>

<style>
html,body{margin:0;background:#fff;-webkit-tap-highlight-color:transparent}
html[data-tall="1"],html[data-tall="1"] body{overflow-y:auto!important;overflow-x:hidden!important;height:auto}
#dc-root{width:390px}
a[data-missing]{cursor:default}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-tpl"><div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, sans-serif; color: #141B26; background: #fff">
  <div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <a href="BookSheet.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 50%; background: #F3F4F6; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141B26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="font-weight: 600; font-size: 17px">Payment</div>
  </div>

  <div style="padding: 14px 20px 0">
    <div style="font-size: 13px; color: #6B7280">Total to pay</div>
    <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin-top: 4px">132,600 <span style="font-size: 18px; font-weight: 600">RWF</span></div>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 18px">
      <img src="img/667a4cad6ffbb8235a742e62f857b10f.jpg" alt="" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover">
      <div style="flex: 1; min-width: 0"><div style="font-weight: 600; font-size: 15px">Sacred Forest Storytelling Walk</div><div class="s">Sat 28 Nov, 09:30 · 2 guests</div></div>
      <a href="BookSheet.html" style="font-size: 14px; font-weight: 600; color: #517A4F">Edit</a>
    </div>
    <div style="margin-top: 16px; padding-top: 10px; border-top: 1px solid #F0F1F4">
      <div class="ln"><span>Visit, 2 guests</span><b>39,000</b></div>
      <div class="ln"><span>Kivu Ride, there and back</span><b>93,600</b></div>
    </div>
  </div>

  <div style="padding: 26px 20px 0">
    <div style="font-weight: 600; font-size: 15px">Pay with</div>
    <div style="margin-top: 12px; border: 1px solid #E5E7EB; border-radius: 14px; overflow: hidden">
      <button class="m" onClick="{{ pickMtn }}"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M12 18h.01"></path></svg></span><div style="flex: 1"><div class="t">MTN MoMo</div><div class="s">078 ••• 171</div></div><span class="rd" style="{{ mtnDot }}"></span></button>
      <button class="m" onClick="{{ pickAirtel }}" style="border-top: 1px solid #F0F1F4"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M12 18h.01"></path></svg></span><div style="flex: 1"><div class="t">Airtel Money</div><div class="s">Add your number next</div></div><span class="rd" style="{{ airDot }}"></span></button>
      <button class="m" onClick="{{ pickCard }}" style="border-top: 1px solid #F0F1F4"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg></span><div style="flex: 1"><div class="t">Card</div><div class="s">Visa or Mastercard</div></div><span class="rd" style="{{ cardDot }}"></span></button>
    </div>
    <div style="font-size: 13px; color: #6B7280; margin-top: 14px; line-height: 1.5">{{ note }}</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px">
    <sc-if value="{{ isMomo }}" hint-placeholder-val="{{ true }}"><a href="Approve.html" style="height: 52px; border-radius: 12px; background: #517A4F; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Pay 132,600 RWF</a></sc-if>
    <sc-if value="{{ isCard }}" hint-placeholder-val="{{ false }}"><a href="Booked.html" style="height: 52px; border-radius: 12px; background: #517A4F; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Continue to card payment</a></sc-if>
    <div style="text-align: center; font-size: 12.5px; color: #9CA3AF; margin-top: 12px">Your places are held for 9:41</div>
  </div>
</div></script>
<script src="player.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: 'mtn' }; }
  renderVals() {
    const m = this.state.m;
    const on = { border: '6px solid #517A4F' };
    const off = { border: '1.5px solid #D1D5DB' };
    const notes = { mtn: 'You will approve with your MoMo PIN on your phone.', airtel: 'You will approve with your Airtel Money PIN on your phone.', card: 'You will enter your card on a secure page. We never store card details.' };
    return {
      pickMtn: () => this.setState({ m: 'mtn' }),
      pickAirtel: () => this.setState({ m: 'airtel' }),
      pickCard: () => this.setState({ m: 'card' }),
      mtnDot: m === 'mtn' ? on : off, airDot: m === 'airtel' ? on : off, cardDot: m === 'card' ? on : off,
      note: notes[m], isCard: m === 'card', isMomo: m !== 'card'
    };
  }
}

</script>
<script>DC.boot('Checkout', 0);</script>
</body>
</html>

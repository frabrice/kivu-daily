.bus{position:absolute;width:16px;height:16px;border-radius:5px;background:#5F6B7A;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.nb{position:absolute;font:700 10px Inter;letter-spacing:1.6px;color:#4B5563}

<title>Chat linked to the booking</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
html,body{overflow:hidden}
*{scrollbar-width:none}

.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;border:0;background:#F3F4F6}
</style>

<style>
html,body{margin:0;background:#fff;-webkit-tap-highlight-color:transparent}

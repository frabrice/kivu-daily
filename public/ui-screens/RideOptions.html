<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { c: 'eco' }; }
  renderVals() {
    const e = this.state.c === 'eco';
    const on = { border: '1.5px solid #517A4F', background: '#F3F7F2' };
    const off = { border: '1.5px solid transparent', background: '#fff' };
    return {
      pickEco: () => this.setState({ c: 'eco' }), pickCom: () => this.setState({ c: 'com' }),
      ecoBox: e ? on : off, comBox: e ? off : on,
      cta: e ? 'Book Economy' : 'Book Comfort'
    };
  }
}

</script>
